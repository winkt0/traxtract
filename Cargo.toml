[package]
name = "traxtract"
version = "0.1.0"
edition = "2024"
description = "Split a concatenated audio file (album / mixtape / playlist) into individual tracks at given timestamps, using ffmpeg."
license = "MIT"

[[bin]]
name = "traxtract"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true